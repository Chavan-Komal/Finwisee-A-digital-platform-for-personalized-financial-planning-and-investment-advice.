server.port=${PORT:8080}

# ---------------------------------------------------------------
# MySQL (default). Override credentials with environment variables:
#   DB_URL, DB_USERNAME, DB_PASSWORD
# To run without MySQL, start with the "h2" profile:
#   mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=h2
# ---------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/finwise_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# File uploads (user documents)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB
app.upload-dir=${UPLOAD_DIR:uploads}

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
# At least 32 bytes for HS256
app.jwt.secret=${JWT_SECRET:change_this_dev_secret_please_replace_with_32_bytes_minimum}
app.jwt.expiration-ms=604800000
